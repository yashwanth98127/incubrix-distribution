key: lemmy
version: 1.0.0
tier: native
auth: bot_token
surfaces:
  - key: post
    content_types: [text, image, video_link]
    spec: {title_max_chars: 200, body_max_chars: 20000, links_allowed: true, accepted_media: [jpg, jpeg, png, gif, mp4]}
rate_limits:
  per_connection: {requests: 30, per_seconds: 60}
capabilities: [publish, status, delete]
error_map:
  "429": PLATFORM_RATE_LIMIT
  "422": PLATFORM_CONTENT_REJECTED
  "401": CONNECTION_AUTH_EXPIRED
  "503": PLATFORM_UNAVAILABLE
instance_param: base_url   # one connector, many Lemmy instances/communities
